name: Fleetsmith
description: Fleetsmith was a San Francisco-based startup (founded 2016) that provided cloud-based Apple
  device management (MDM) for IT teams — automated zero-touch setup, patching, app deployment, and
  security enforcement across Macs, iPhones, iPads, and Apple TVs. Backed by Menlo Ventures and others,
  Fleetsmith was acquired by Apple in June 2020; Apple subsequently discontinued the standalone product
  and folded its capabilities into Apple Business Essentials. The company no longer operates an
  independent developer program or public API, and fleetsmith.com now redirects to Apple Business
  Essentials. This profile is retained for network history.
